[project]
name = "pwshpy"
version = "1.0.2"
description = "A genuinely Pythonic PowerShell: typed records and a fluent pipeline over native Windows bindings, with an in-process PowerShell 7 SDK fallback — never a pwsh.exe subprocess."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich-click>=1.9.8",
    "lib_cli_exit_tools>=2.3.2",
    "lib_log_rich>=6.3.5",
    "lib_layered_config>=5.6.0",
    "pydantic>=2.13.4",
    "orjson>=3.11.9",
    "psutil>=7.2.2",
    # Safe XML parsing for the event-log adapter's rendered event XML (pure Python, portable).
    "defusedxml>=0.7.1",
    # Windows-only native bindings (Tier A). Platform-gated so base installs on
    # Linux/macOS pull only the portable subset (psutil).
    "pywin32>=312; sys_platform == 'win32'",
    "wmi>=1.5.1; sys_platform == 'win32'",
    # Typed winreg wrapper backing the Registry Tier-A adapter (Windows-only at
    # runtime; the dev extra installs it cross-OS for the hermetic fake_winreg tests).
    "lib_registry>=3.1.3; sys_platform == 'win32'",
    # Linux-only native bindings. Pure-Python D-Bus (jeepney) backs the systemd services
    # adapter; a universal wheel, so it is safe as a base dep (mirrors pywin32 on Windows).
    # journald's systemd-python is the one exception - source-only, so it stays the [journald]
    # extra (a hard dep would break `pip install pwshpy` on a Linux box without libsystemd-dev).
    "jeepney>=0.9.0; sys_platform == 'linux'",
]
license = { text = "MIT" }
authors = [{ name = "bitranox", email = "bitranox@gmail.com" }]
keywords = ["powershell", "windows", "pwsh", "cim", "wmi", "pythonnet", "cli", "rich-click"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

# System packages required for CI runners (read by GitHub Actions workflow template)
# Format: "apt_package_name" for Ubuntu, future: {"apt": "...", "brew": "...", "choco": "..."}
[tool.ci]
system-dependencies-ubuntu = []
system-dependencies-macos = []
system-dependencies-windows-pip = []
system-dependencies-windows-choco = []
os = ["ubuntu-latest", "windows-latest", "macos-latest"]

[project.urls]
Homepage = "https://github.com/bitranox/pwshpy"
Repository = "https://github.com/bitranox/pwshpy.git"
Issues = "https://github.com/bitranox/pwshpy/issues"

[project.optional-dependencies]
# Tier B — hosted PowerShell 7.6 SDK (in-process via pythonnet/CoreCLR).
# Requires the .NET 10 runtime present. A Tier-B call without this extra raises
# FeatureUnavailableError naming this exact install.
full = [
  "pythonnet>=3.1.0",
  "clr-loader>=0.3.1",
]
# Linux event log via journald (get_win_event on Linux). systemd-python builds a C
# extension, so it needs libsystemd-dev + a compiler; kept optional for that reason.
# Without it, get_win_event on Linux raises PlatformUnsupportedError naming this install.
# journald event log on Linux (get_win_event). systemd-python is source-only (builds a C
# extension against libsystemd-dev), so it stays an extra: a hard base dep would break
# `pip install pwshpy` on a Linux box without a compiler + libsystemd-dev. jeepney (services)
# is a base Linux dep - a pure wheel needs no such gate.
journald = [
  "systemd-python>=235; sys_platform == 'linux'",
]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "hypothesis>=6.157.0",
  "ruff>=0.15.22",
  "pyright[nodejs]>=1.1.411",
  "bandit>=1.9.4",
  # 1.5.1 was yanked upstream (unintended breaking changes), so 1.5.0 is the newest usable
  # release; a >=1.5.1 floor makes the whole dev extra unresolvable. Raise once 1.5.2+ ships.
  "build>=1.5.0",
  "twine>=6.2.0",
  # codecov-cli is disabled, not dropped: it requires click<8.3.0, which drags click back to
  # 8.2.1 - the version with CVE-2026-7246 (command injection in click.edit(), fixed in 8.3.3).
  # Nothing else here caps click, so with this line active the audit gate goes red on every
  # clean install. Leaving it off costs nothing: CI uploads coverage via codecov/codecov-action,
  # not this CLI, and "bmk codecov" resolves codecovcli from PATH and only warns when absent.
  # Re-enable once codecov-cli relaxes its click<8.3.0 pin.
  # "codecov-cli>=11.3.1",
  "pip-audit>=2.10.1",
  "textual>=8.2.8",
  "import-linter>=2.13",
  "rtoml>=0.13.0",
  "httpx2>=2.7.0",
  # Registry subsystem: lib_registry (+ its fake_winreg backend) on every dev OS
  # so the hermetic registry tests run in CI on Linux/macOS/Windows alike.
  "lib_registry>=3.1.3",
  "fake_winreg>=1.9.1",
  "types-defusedxml>=0.7.0.20260504",
  # Transitive CVE pins
  "click>=8.4.2",                # CVE-2026-7246
  "jaraco-context>=6.1.2",       # CVE-2025-23949
  "python-multipart>=0.0.32",    # CVE-2025-24486
  "wheel>=0.47.0",               # CVE-2025-24049
  "pynacl>=1.6.2",               # CVE-2025-69277
  "urllib3>=2.7.0",              # CVE-2025-66471, CVE-2025-66418
  "virtualenv>=21.6.1",         # CVE-2025-22702
]

[project.scripts]
pwshpy = "pwshpy.entry:main"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pwshpy"]
include = [
    "src/pwshpy/py.typed",
    "src/pwshpy/adapters/config/defaultconfig.toml",
    "src/pwshpy/adapters/config/defaultconfig.d/*.toml",
    "src/pwshpy/adapters/native/templates/*.ps1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtins shadowing
  "C4",          # comprehension simplification
  "SIM",         # simplification
  "TCH",         # type-checking imports
  "RUF",         # ruff-specific
  "G",           # logging format (catches f-string in logger)
  "T20",         # print statements
  "PTH",         # pathlib preference
  "PLC", "PLE",  # pylint conventions/errors
  "S",           # flake8-bandit security checks
  "PERF",        # performance anti-patterns
  "ERA",         # eradicate dead/commented-out code
  "FBT",         # boolean trap (boolean positional args)
  "PLR",         # pylint refactor
  "PLW",         # pylint warnings
]
ignore = [
  "RUF002",    # ambiguous unicode characters in docstrings (en-dash) - typography choice
  "RUF022",    # unsorted __all__ - kept in logical grouping order
  "PLC0415",   # deferred imports inside functions - circular import prevention
  "TC001",     # stdlib imports at runtime - needed, not just for type hints
  "TC002",     # third-party imports at runtime - needed, not just for type hints
  "TC003",     # stdlib imports - same as TC001
  "TC006",     # cast() type expressions - existing code uses unquoted
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Notebooks: unused imports are often intentional for side effects
"notebooks/*.ipynb" = ["F401"]
# Tests: assert is standard, test fixtures have passwords, magic values are clearer inline, temp paths are fine
"tests/*.py" = ["T20", "S101", "S105", "S106", "S108", "FBT001", "FBT003", "PLR0913", "PLR2004"]
# CLI: Click dictates each command's signature (one parameter per option/argument, injected by
# name), so the option count is inherent - it trips both the total-args (PLR0913) and
# positional-count (PLR0917) thresholds no matter how the params are declared.
"src/pwshpy/adapters/cli/**/*.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
# Protocols/adapters: many-param signatures by design
"src/pwshpy/application/*.py" = ["PLR0913"]
"src/pwshpy/adapters/config/*.py" = ["PLR0913"]
"src/pwshpy/adapters/memory/*.py" = ["PLR0913"]
# Composition root: the ps facade wires one injected adapter per Tier-A subsystem
"src/pwshpy/composition/*.py" = ["PLR0913"]

[tool.pyright]
typeCheckingMode = "strict"
extraPaths = [
  "src",
]

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
pythonpath = ["src"]
markers = [
  "os_agnostic: test runs on every supported operating system",
  "os_windows: test exercises Windows-only behavior",
  "os_macos: test exercises macOS-only behavior",
  "os_posix: test exercises behavior requiring POSIX semantics",
  "os_linux: test exercises Linux-only behavior",
  "local_only: tests that require the local dev environment (external resources, script composition); skipped in CI",
  "integration: tests requiring external resources (SMTP, databases, APIs); run via 'bmk ti' or 'mktesti.sh'",
  "mutating: tests that CHANGE host state (mutating Tier-A verbs); run only on the disposable throwaway VM, never CI",
]

[tool.coverage.run]
branch = true
parallel = false
# Use a temp directory for the coverage database to avoid SQLite locking
# issues on network-mounted filesystems. The {envtmpdir} placeholder is
# not supported by coverage.py, so we use an environment variable with
# fallback to a cross-platform temp location via the pytest_configure
# hook in tests/conftest.py. CI also sets COVERAGE_FILE via workflow env.
#
# For local development, the pytest hook automatically redirects to
# tempfile.gettempdir() before pytest-cov creates its Coverage() object.
# This static fallback catches edge cases where coverage is run directly.
data_file = "/tmp/.coverage.pwshpy"
source = ["src/pwshpy"]

[tool.coverage.report]
omit = [
  "tests/*",
]
fail_under = 80
show_missing = true

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.clean]
# Patterns to remove when running `make clean`
patterns = [
  "**/__pycache__",
  ".hypothesis",
  ".import_linter_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".pyright",
  ".mypy_cache",
  ".tox",
  ".nox",
  ".eggs",
  "*.egg-info",
  "build",
  "dist",
  "htmlcov",
  ".coverage",
  "coverage.xml",
  "codecov.sh",
  ".cache",
  "result",
  ".data_arch_violations.json",
]

[tool.git]
# Default git remote for push/release commands
default-remote = "origin"

[tool.scripts.test]
# Configuration for CI/CD test runner
pytest-verbosity = "-vv"
coverage-report-file = "coverage.xml"
src-path = "src"
# `make test` skips only host-MUTATING tests (the `mutating` marker). The quick local
# gate still runs the safe `local_only` tests: the Windows-oracle reads skip on Linux,
# and the .NET / live-journald tests skip when their runtime / journal is absent. This
# follows bmk's design (`make test` runs `local_only`, excludes only the named marker)
# while keeping host mutation off the dev box. The mutating suite runs on the disposable
# throwaway VM (`pytest -m mutating`); CI runs `pytest -m "not local_only"`.
exclude-markers = "mutating"

[tool.importlinter]
root_package = "pwshpy"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Domain is pure (no adapter dependencies)"
type = "forbidden"
source_modules = [
  "pwshpy.domain",
]
forbidden_modules = [
  "pwshpy.adapters",
  "pwshpy.composition",
]

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
  # Composition wires adapters - can import everything
  "pwshpy.composition",
  # Adapters implement ports - can import application and domain
  "pwshpy.adapters",
  # Application defines ports - can import domain
  "pwshpy.application",
  # Domain is pure - bottom layer
  "pwshpy.domain",
]

[tool.pip-audit]
# Empty on purpose, and it should stay that way: an ignored id is a vulnerability we have
# decided not to see, so each one needs a live reason. Every entry here was for a package
# that merely happened to sit in the dev environment (py, pip, pillow), and the audit is now
# scoped to this project's own dependency tree, so such packages are not audited at all -
# the entries protected against nothing while still reading like they did. Verified inert
# before removal: py and pillow are not installed, and pip's two ids were against 24.3.1
# (26.1.2 is installed).
#
# Add an id here only for a vulnerability in a REAL dependency of this project with no fixed
# release, and say why. If a dependency caps a package below its fix, remove the capper
# instead - that fixes the CVE rather than hiding it (see the codecov-cli note in [dev]).
ignore-vulns = []

[tool.bashate]
# bashate style settings for .sh files (E003 excluded: indent handled by shfmt)
max-line-length = 120
ignores = ["E003"]
